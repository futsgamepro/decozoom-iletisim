<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Decozoom İç Mimarlık proje talep formu">
  <title>Decozoom | Proje Talep Formu</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    html { background: #000; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; padding: 34px 20px 48px; background: #000; color: white; }
    main { width: min(100%, 850px); margin: 0 auto; }
    .logo { display: block; width: min(100%, 365px); height: auto; margin: 0 auto 12px; }
    h1 { margin: 0; text-align: center; font-size: clamp(22px, 4vw, 29px); font-weight: 750; letter-spacing: .035em; }
    .intro { margin: 10px auto 30px; color: #bdbdbd; line-height: 1.6; font-size: 14px; text-align: center; }
    form { margin: 0 auto; }
    .fields { display: grid; gap: 19px; }
    .field { display: grid; grid-template-columns: 1fr; align-items: stretch; gap: 9px; }
    label { display: block; color: #fff; font-size: 16px; font-weight: 800; line-height: 1.45; }
    input, textarea, select {
      display: block; width: 100%; border: 1px solid #868686; border-radius: 11px;
      background: #1c1c1c; color: #fff; font: 16px/1.5 Arial, Helvetica, sans-serif;
      padding: 14px 16px; outline: none; transition: border-color .17s, box-shadow .17s;
    }
    input, select { min-height: 52px; }
    textarea { min-height: 86px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: #b5b5b5; opacity: 1; }
    select { cursor: pointer; min-width: 0; text-overflow: ellipsis; }
    select:disabled { color: #9b9b9b; cursor: not-allowed; opacity: 0.75; }
    select option { color: #fff; background: #1c1c1c; }
    .region-title { display: block; color: #fff; font-size: 16px; font-weight: 800; line-height: 1.45; }
    .region-selects { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .region-part { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .region-part label { font-size: 13px; font-weight: 700; }
    .region-status { color: #bfbfbf; font-size: 12px; line-height: 1.4; margin: 0; }
    .region-status:empty { display: none; }
    .region-part select, .region-part input { min-width: 0; padding: 14px 12px; }

    input:focus, textarea:focus, select:focus { border-color: #f2f2f2; box-shadow: 0 0 0 3px rgba(255,255,255,.13); }
    .submit { display: block; width: min(100%, 360px); min-height: 58px; padding: 15px 23px; margin: 32px auto 0;
      border-radius: 12px; border: 1px solid #e7e7e7; background: #dedede; color: #101010;
      font: 800 18px Arial, Helvetica, sans-serif; cursor: pointer; transition: background .18s, transform .18s; }
    .submit:hover { background: #f2f2f2; transform: translateY(-1px); }
    .submit:focus-visible, .back:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .back { display: block; width: max-content; text-align: center; margin: 21px auto 0; text-decoration: none; color: #bcbcbc; font-size: 14px; }
    .back:hover { color: white; }
    .note { text-align: center; color: #adadad; margin: 19px auto 0; font-size: 12px; line-height: 1.5; max-width: 560px; }
    .trap { position: absolute; left: -9999px; opacity: 0; height: 0; overflow: hidden; }
    @media (max-width: 620px) {
      body { padding: 22px 18px 35px; }
      .logo { width: min(100%, 300px); }
      .intro { margin-bottom: 23px; }
      .fields { gap: 19px; }
      .field { grid-template-columns: 1fr; gap: 9px; }
      label { font-size: 15px; }
      input, textarea, select { font-size: 16px; }
      .region-selects { gap: 7px; }
      .region-part select, .region-part input { font-size: 14px; padding: 12px 7px; }
      .region-part label { font-size: 12px; }
      .region-title { font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) { input, textarea, select, .submit { transition: none; } }
  </style>
</head>

    <h1>PROJE TALEP FORMU</h1>
    <p class="intro">Projenizle ilgili bilgileri doldurarak bize iletebilirsiniz.</p>

    <!-- GitHub Pages üzerinde FormSubmit ile gönderim. İlk kullanımda alıcı doğrulaması gerekir. -->
    <form name="decozoom-proje-talep" method="POST" action="https://formsubmit.co/decozoominteriordesign@gmail.com" accept-charset="UTF-8">
      <input type="hidden" name="_subject" value="PANELDEN FORM GÖNDERİMİ">
      <input type="hidden" name="_next" id="formSubmitNext" value="">
      <div class="trap" aria-hidden="true"><label for="bot-field">Bu alanı boş bırakın</label><input type="text" id="bot-field" name="_honey" tabindex="-1" autocomplete="off"></div>

      <div class="fields">
        <div class="field">
          <label for="projectType">Proje türünüz nedir?</label>
          <textarea id="projectType" name="Proje türünüz nedir?" rows="2" required maxlength="250" placeholder="Villa / Konut / Ofis / Tek alan / Banyo / Mutfak / Salon / Yatak odası / Çocuk odası gibi"></textarea>
        </div>
        <div class="field">
          <div class="region-title" id="regionTitle">Projeniz hangi bölgede?</div>
          <div class="region-selects" role="group" aria-labelledby="regionTitle">
            <div class="region-part">
              <label for="province">İl</label>
              <select id="province" name="İl" required autocomplete="address-level1" disabled>
                <option value="">İller yükleniyor…</option>
              </select>
            </div>
            <div class="region-part">
              <label for="district">İlçe</label>
              <select id="district" name="İlçe" required autocomplete="address-level2" disabled>
                <option value="">Önce il seçin</option>
              </select>
            </div>
            <div class="region-part">
              <label for="neighborhood">Mahalle</label>
              <select id="neighborhood" name="Mahalle" required disabled>
                <option value="">Önce ilçe seçin</option>
              </select>
            </div>
          </div>
          <p id="regionStatus" class="region-status" role="status" aria-live="polite">İl, ilçe ve mahalle seçenekleri yükleniyor…</p>
        </div>
        <div class="field">
          <label for="start">Ne zaman başlamayı düşünüyorsunuz?</label>
          <input id="start" name="Ne zaman başlamayı düşünüyorsunuz?" type="text" required maxlength="100" placeholder="Örn. 2 ay içinde / Mart 2027">
        </div>
        <div class="field">
          <label for="budget">Yaklaşık proje bütçeniz?</label>
          <input id="budget" name="Yaklaşık proje bütçeniz?" type="text" required maxlength="100" placeholder="Örn. 500.000 TL">
        </div>
        <div class="field">
          <label for="email">E-Posta adresiniz?</label>
          <input id="email" name="email" type="email" required maxlength="254" autocomplete="email" placeholder="ornek@eposta.com">
        </div>
        <div class="field">
          <label for="phone">Telefon numaranız?</label>
          <input id="phone" name="Telefon numaranız?" type="tel" required maxlength="30" autocomplete="tel" inputmode="tel" placeholder="05XX XXX XX XX">
        </div>
      </div>

      <button type="submit" class="submit">GÖNDER</button>
      <p class="note">Gönderdiğiniz bilgiler, proje talebinizin değerlendirilmesi amacıyla Decozoom ekibine iletilir.</p>
      <a class="back" href="index.html">← Ana sayfaya dön</a>
    </form>
  </main>

  <script>
    // FormSubmit'in teşekkür ekranı için GitHub Pages'in gerçek adresini kullan.
    // Proje sayfalarındaki /repo/ alt yolunu da destekler.
    (() => {
      const urlField = document.getElementById('formSubmitNext');
      if (urlField && /^https?:$/.test(window.location.protocol)) {
        urlField.value = new URL('tesekkurler.html', window.location.href).href;
      }
    })();
  </script>
  <script>
    (() => {
      'use strict';
      // Türkiye il/ilçe/mahalle seçenekleri açık veri kaynağından alınır.
      // Kaynak: github.com/ferhat-mousavi/turkiye-il-ilce-mahalle-koy (MIT).
      const sources = [
        'https://cdn.jsdelivr.net/gh/ferhat-mousavi/turkiye-il-ilce-mahalle-koy@main/turkiye-il-ilce-mahalle.json',
        'https://raw.githubusercontent.com/ferhat-mousavi/turkiye-il-ilce-mahalle-koy/main/turkiye-il-ilce-mahalle.json'
      ];
      const province = document.getElementById('province');
      const district = document.getElementById('district');
      const neighborhood = document.getElementById('neighborhood');
      const status = document.getElementById('regionStatus');
      const collator = new Intl.Collator('tr-TR', { sensitivity: 'base' });
      let data = null;

      const sorted = values => [...new Set(values)].sort((a, b) => collator.compare(a, b));
      function reset(element, placeholder) {
        element.replaceChildren(new Option(placeholder, ''));
        element.disabled = true;
        element.value = '';
      }
      function populate(element, values, placeholder) {
        reset(element, placeholder);
        for (const name of sorted(values)) element.add(new Option(name, name));
        element.disabled = false;
      }
      province.addEventListener('change', () => {
        reset(district, 'Önce il seçin');
        reset(neighborhood, 'Önce ilçe seçin');
        const districts = data?.[province.value];
        if (districts && typeof districts === 'object') {
          populate(district, Object.keys(districts), 'İlçe seçin');
        }
      });
      district.addEventListener('change', () => {
        reset(neighborhood, 'Önce ilçe seçin');
        const neighborhoods = data?.[province.value]?.[district.value];
        if (Array.isArray(neighborhoods) && neighborhoods.length) {
          populate(neighborhood, neighborhoods, 'Mahalle seçin');
        }
      });

      function manualFallback() {
        // Dış veri kaynağına ulaşılamazsa formun doldurulabilmesini engelleme.
        for (const [select, placeholder] of [
          [province, 'İl yazın'], [district, 'İlçe yazın'], [neighborhood, 'Mahalle yazın']
        ]) {
          const input = document.createElement('input');
          input.id = select.id;
          input.name = select.name;
          input.type = 'text';
          input.required = true;
          input.maxLength = 100;
          input.placeholder = placeholder;
          select.replaceWith(input);
        }
        status.textContent = 'Seçim listesi yüklenemedi; konum bilgilerini yazarak devam edebilirsiniz.';
      }

      async function loadData() {
        for (const url of sources) {
          try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 12000);
            let response;
            try {
              response = await fetch(url, { signal: controller.signal, cache: 'force-cache' });
              if (!response.ok) throw new Error('HTTP ' + response.status);
              const result = await response.json();
              if (!result || typeof result !== 'object' || Object.keys(result).length < 70) {
                throw new Error('Beklenmeyen veri biçimi');
              }
              data = result;
            } finally {
              clearTimeout(timeout);
            }
            populate(province, Object.keys(data), 'İl seçin');
            status.textContent = '';
            return;
          } catch (error) {
            // Alternatif açık veri adresi denenir.
          }
        }
        manualFallback();
      }
      loadData();
    })();
  </script>
